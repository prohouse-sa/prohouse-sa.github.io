name: Finalize Pro House SEO domain

on:
  push:
    branches:
      - agent/seo-local-pages
    paths:
      - .github/workflows/finalize-seo-domain.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-local-pages
          fetch-depth: 0

      - name: Use prohouse.sa as the canonical domain
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://prohouse-sa.github.io'
          new = 'https://prohouse.sa'
          paths = [
              Path('index.html'),
              Path('en/index.html'),
              Path('menu/index.html'),
              Path('healthy-meals-jeddah/index.html'),
              Path('meal-subscriptions-jeddah/index.html'),
              Path('branches/al-rawdah/index.html'),
              Path('branches/al-shati/index.html'),
              Path('robots.txt'),
              Path('sitemap.xml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(old, new), encoding='utf-8')
          Path('CNAME').write_text('prohouse.sa\n', encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-seo-domain.yml

      - name: Validate final domain references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          ET.parse('sitemap.xml')
          required = [
              'index.html',
              'en/index.html',
              'menu/index.html',
              'healthy-meals-jeddah/index.html',
              'meal-subscriptions-jeddah/index.html',
              'branches/al-rawdah/index.html',
              'branches/al-shati/index.html',
              'robots.txt',
              'sitemap.xml',
          ]
          for item in required:
              text = Path(item).read_text(encoding='utf-8')
              if 'https://prohouse-sa.github.io' in text:
                  raise SystemExit(f'Old domain remains in {item}')
          for item in [p for p in required if p.endswith('.html')]:
              text = Path(item).read_text(encoding='utf-8')
              canonical = re.search(r'<link rel="canonical" href="([^"]+)"', text)
              if not canonical or not canonical.group(1).startswith('https://prohouse.sa'):
                  raise SystemExit(f'Invalid canonical in {item}')
          if Path('CNAME').read_text(encoding='utf-8').strip() != 'prohouse.sa':
              raise SystemExit('Invalid CNAME')
          print('Final domain validation passed.')
          PY

      - name: Commit finalized SEO changes
        run: |
          git config user.name "Pro House Automation"
          git config user.email "noreply@prohouse.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use prohouse.sa as the canonical site domain"
          git push origin HEAD:agent/seo-local-pages
